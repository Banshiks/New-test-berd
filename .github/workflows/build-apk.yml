name: Build PathTracer APK

on:
  workflow_dispatch:
  push:
    branches: [ 'claude/**' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x pathtracer-android/gradlew

      - name: Build Debug APK
        working-directory: pathtracer-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PathTracer-debug
          path: pathtracer-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
